# Teste da chave do Gemini (só confere se responde; nunca mostra a chave).
name: Teste do Gemini
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          k = os.environ.get("GEMINI_API_KEY", "")
          if not k:
              raise SystemExit("SEM CHAVE: o secret GEMINI_API_KEY não chegou ao robô")
          print("formato da chave:", k[:3] + "…", "tamanho", len(k))
          base = "https://generativelanguage.googleapis.com/v1beta"
          def chamar(url, corpo=None):
              req = urllib.request.Request(url, data=json.dumps(corpo).encode() if corpo else None,
                  headers={"x-goog-api-key": k, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("ERRO", e.code, e.read().decode()[:600]); raise SystemExit(1)
          modelos = chamar(f"{base}/models?pageSize=200").get("models", [])
          gerar = [m["name"].split("/")[1] for m in modelos if "generateContent" in m.get("supportedGenerationMethods", [])]
          print("MODELOS:", ", ".join(gerar))
          print("TODOS:", len(gerar))
          for nome in ["gemini-flash-latest", "gemini-flash-lite-latest", "gemini-3-flash-preview", "gemini-3.1-flash-lite-preview", "gemini-2.5-flash", "gemini-2.5-flash-lite"] + [m for m in gerar if m.startswith("gemini-3") and "flash" in m]:
              if nome not in gerar: continue
              req = urllib.request.Request(f"{base}/models/{nome}:generateContent",
                  data=json.dumps({"contents": [{"parts": [{"text": "Responda só com um título curto, em português, para um post sobre a rodada da Bundesliga."}]}]}).encode(),
                  headers={"x-goog-api-key": k, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      t = json.load(r)["candidates"][0]["content"]["parts"][0]["text"].strip()
                  print("OK", nome, "→", t[:80])
              except urllib.error.HTTPError as e:
                  corpo = e.read().decode()
                  try:
                      msg = json.loads(corpo)["error"]["message"][:220]
                  except Exception:
                      msg = corpo[:220]
                  print("FALHOU", nome, e.code, msg.replace("\n", " "))
          PY
