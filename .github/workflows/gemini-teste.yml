# Teste da chave do Gemini (só confere se responde; nunca mostra a chave).
name: Teste do Gemini
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          k = os.environ.get("GEMINI_API_KEY", "")
          if not k:
              raise SystemExit("SEM CHAVE: o secret GEMINI_API_KEY não chegou ao robô")
          print("formato da chave:", k[:3] + "…", "tamanho", len(k))
          base = "https://generativelanguage.googleapis.com/v1beta"
          def chamar(url, corpo=None):
              req = urllib.request.Request(url, data=json.dumps(corpo).encode() if corpo else None,
                  headers={"x-goog-api-key": k, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("ERRO", e.code, e.read().decode()[:600]); raise SystemExit(1)
          modelos = chamar(f"{base}/models?pageSize=200").get("models", [])
          gerar = [m["name"].split("/")[1] for m in modelos if "generateContent" in m.get("supportedGenerationMethods", [])]
          print("MODELOS:", ", ".join(gerar))
          for nome in ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite"]:
              for ferramenta in ({"google_search": {}}, {"url_context": {}}):
                  corpo = {"contents": [{"parts": [{"text": "Encontre 2 URLs de fotos oficiais (site oficial do clube) do Hertha BSC em jogo recente. Responda só com as URLs da página e da imagem."}]}], "tools": [ferramenta]}
                  req = urllib.request.Request(f"{base}/models/{nome}:generateContent", data=json.dumps(corpo).encode(),
                      headers={"x-goog-api-key": k, "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=90) as r:
                          out = json.load(r)
                      t = "".join(p.get("text", "") for p in out["candidates"][0]["content"]["parts"])
                      print("OK", nome, list(ferramenta), "→", t[:300].replace("\n", " "))
                  except urllib.error.HTTPError as e:
                      corpo = e.read().decode()
                      try:
                          msg = json.loads(corpo)["error"]["message"][:200]
                      except Exception:
                          msg = corpo[:200]
                      print("FALHOU", nome, list(ferramenta), e.code, msg.replace("\n", " "))
                  except Exception as e:
                      print("FALHOU", nome, list(ferramenta), e)
          PY
