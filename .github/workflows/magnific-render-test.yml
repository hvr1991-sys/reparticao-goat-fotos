name: Magnific original renderer integration
on:
  push:
    branches: [ia-goat-original]
    paths: ['.github/workflows/magnific-render-test.yml']
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: magnific-visual-test
          run-id: 45696516666
          github-token: ${{ github.token }}
          path: /tmp/goat-magnific
      - run: pip install pillow==11.1.0 numpy==2.2.3 playwright==1.49.1
      - run: |
          if [ ! -x /usr/bin/google-chrome ]; then
            python -m playwright install --with-deps chromium
          fi
      - name: Render original agenda with generated background
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('/tmp/goat-magnific')
          with Image.open(p/'background.png') as im:
              im.verify()
          spec={"tipo":"agenda","marca":"logo","ilustrativo":True,"data_dia_semana":"SAB","data_resto":"28.11","fundo":str(p/'background.png'),"jogos":[{"horario":"16H","rotulo":"TESTE TECNICO","confronto":"PROGRAMA A"},{"horario":"18H","rotulo":"TESTE TECNICO","confronto":"PROGRAMA B"}]}
          (p/'spec.json').write_text(json.dumps(spec,ensure_ascii=False))
          PY
          python kit/render.py /tmp/goat-magnific/spec.json /tmp/goat-magnific/agenda.png
          python - <<'PY'
          from PIL import Image
          with Image.open('/tmp/goat-magnific/agenda.png') as im:
              assert im.size==(1080,1350)
              im.verify()
          print("Original renderer PNG verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: magnific-goat-original-agenda
          path: /tmp/goat-magnific/
          retention-days: 3
