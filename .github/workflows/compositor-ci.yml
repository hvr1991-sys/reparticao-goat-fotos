name: Testes compositor GOAT 2.0
on:
  push:
    branches: [motor-goat-2.0]
    paths:
      - 'kit/**'
      - '.github/workflows/compositor-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/motor-goat-2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow==11.1.0 numpy==2.2.2 playwright==1.49.1
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=kit python -m unittest discover -s kit -p test_compositor_v2.py -v
