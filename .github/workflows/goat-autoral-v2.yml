name: GOAT 2.0 - laboratorio autoral
on:
  push:
    branches: [motor-goat-2.0]
    paths:
      - '.github/workflows/goat-autoral-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    if: github.ref == 'refs/heads/motor-goat-2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow==11.1.0 numpy==2.2.2 playwright==1.49.1
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=kit python kit/laboratorio_autoral_v2.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goat-laboratorio-autoral
          path: laboratorio-autoral/
          retention-days: 7
