name: GOAT isolated designer round
on:
  push:
    branches: [ia-goat-original]
    paths: ['.github/workflows/goat-round-preview.yml', 'tools/preview_round.py']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.1.0 numpy==2.2.3 playwright==1.49.1
      - run: |
          if [ ! -x /usr/bin/google-chrome ]; then
            python -m playwright install --with-deps chromium
          fi
      - run: python -m tools.preview_round
      - uses: actions/upload-artifact@v4
        with:
          name: goat-round-preview
          path: /tmp/goat-round-preview/
          retention-days: 3
