name: Baixar fotos

on:
  push:
    branches: [main]
    paths: ["jobs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baixar-fotos
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.1.0
      - run: python tools/baixar.py
      - name: Salvar fotos no repositório
        run: |
          git config user.name "reparticao-goat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "fotos baixadas"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
