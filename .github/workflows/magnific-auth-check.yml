name: Magnific authentication check
on:
  push:
    branches: [ia-goat-original]
    paths: ['.github/workflows/magnific-auth-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read-only API check
        env:
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ.get("MAGNIFIC_API_KEY")
          if not key:
              raise SystemExit("Secret ausente")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          req = urllib.request.Request("https://api.magnific.com/v1/resources?term=football&limit=1", headers={"x-magnific-api-key": key, "Accept": "application/json"}, method="GET")
          try:
              with opener.open(req, timeout=30) as r:
                  result = json.load(r)
                  print("HTTP", r.status)
                  if not isinstance(result.get("data"), list):
                      raise SystemExit("Unexpected response schema")
                  print("Consulta autenticada; sem download ou geração.")
          except urllib.error.HTTPError as e:
              raise SystemExit(f"HTTP {e.code}; consulta não confirmada")
          PY
