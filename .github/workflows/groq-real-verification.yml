name: GOAT Groq access diagnostic
on:
  push:
    branches: [groq-real-verification]
    paths: ['.github/workflows/groq-real-verification.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Read only model access
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,re
          key=os.environ.get("GROQ_API_KEY")
          assert key, "Missing configured secret"
          req=urllib.request.Request("https://api.groq.com/openai/v1/models",headers={"Authorization":"Bearer "+key})
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  result=json.load(response)
                  ids={x["id"] for x in result.get("data",[]) if isinstance(x,dict) and isinstance(x.get("id"),str)}
                  print("HTTP:",response.status)
                  for name in ("openai/gpt-oss-20b","openai/gpt-oss-120b","qwen/qwen3.8-27b"):
                      print("MODEL:",name,"listed" if name in ids else "not_listed")
          except urllib.error.HTTPError as e:
              print("HTTP:",e.code)
              try:
                  error=json.loads(e.read(32768)).get("error",{})
                  for field in ("code","type"):
                      value=error.get(field)
                      if isinstance(value,str) and re.fullmatch(r"[a-zA-Z0-9_-]{1,80}",value):
                          print("ERROR_"+field.upper()+":",value)
              except Exception:
                  print("Non-JSON or unrecognized error body")
              raise SystemExit(1)
          PY
