name: Processar pedidos da Repartição

# A rodada agendada grava pedidos (fotos e artes) na fila rg_jobs do Supabase.
# Este robô fica de plantão ~50 min por execução, olhando a fila a cada 30 s:
# baixa as fotos, monta as artes com o kit e envia ao painel.
# Ao terminar, cada plantão chama o próximo; o agendamento abaixo é a reserva (só um por vez).
# Autenticação por token OIDC do GitHub: nenhum segredo guardado.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config/runtime.json]

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: processar-pedidos
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  plantao:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: fotos/_magnific_tasks.json
          key: magnific-main-${{ github.run_id }}
          restore-keys: magnific-main-
      # o runner já tem o Google Chrome; o kit e o robô usam ele (sem baixar outro navegador)
      - run: pip install pillow==11.1.0 numpy==2.2.3 playwright==1.49.1 "opencv-python-headless==4.10.0.84"
      - name: Plantão
        env:
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOAT_MAX_LLM_CALLS: "40"
          GOAT_MAX_VISUAL_PER_RUN: "2"
          GOAT_MAX_VISUAL_PER_DAY: "8"
        run: |
          git config user.name "reparticao-goat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/processar.py 50
      - uses: actions/cache/save@v4
        if: always() && hashFiles('fotos/_magnific_tasks.json') != ''
        with:
          path: fotos/_magnific_tasks.json
          key: magnific-main-${{ github.run_id }}
      # emenda o próximo plantão (o agendamento do GitHub às vezes atrasa ou não dispara)
      - name: Próximo plantão
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run processar-pedidos.yml --ref main -R "$GITHUB_REPOSITORY"
