name: Processar pedidos da Repartição
on:
  push:
    branches: [main]
    paths: ['.github/workflows/processar-pedidos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: processar-pedidos
  cancel-in-progress: true
jobs:
  pausa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Pausa de transicao para o fluxo Claude original; nenhuma chamada de IA ou escrita no banco."
