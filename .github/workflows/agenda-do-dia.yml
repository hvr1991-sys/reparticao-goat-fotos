# Agenda real: biblioteca oficial + equipe escalada + revisão visual gratuita.
# Magnific tem prioridade para recursos visuais criativos; esta agenda usa a skill original.
name: Agenda do dia (robô)
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Prévia ou envio de artes revisadas à Mesa do Gestor"
        type: choice
        options: [amostra, valer]
        default: amostra
      dias:
        description: "Dias AAAA-MM-DD separados por espaço (vazio = amanhã e depois)"
        default: ""
permissions:
  contents: write
  id-token: write
concurrency:
  group: agenda-do-dia
  cancel-in-progress: false
jobs:
  agenda:
    if: inputs.modo != 'valer' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.1.0 numpy==2.2.3 playwright==1.49.1 opencv-python-headless==4.10.0.84
      - name: Preparar navegador
        run: |
          if [ ! -x /usr/bin/google-chrome ]; then python -m playwright install --with-deps chromium; fi
      - name: Montar e revisar a agenda
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOAT_MAX_LLM_CALLS: "45"
          GOAT_AGENDA_MODO: ${{ inputs.modo }}
          GOAT_AGENDA_DIAS: ${{ inputs.dias }}
          GOAT_AGENDA_REVIEW_DIR: /tmp/goat-agenda-review
        run: |
          git config user.name "reparticao-goat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/agenda_robo.py "$GOAT_AGENDA_MODO" "$GOAT_AGENDA_DIAS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenda-revisada
          path: /tmp/goat-agenda-review
          retention-days: 7
          if-no-files-found: warn
