name: Arquivado - Teste editorial GOAT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    # Preservado no histórico; o fluxo ativo usa Magnific e OpenRouter gratuito.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        provider: [cloudflare, openrouter]
    steps:
      - name: Avaliar pauta e briefing
        env:
          PROVIDER: ${{ matrix.provider }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,time,re,sys
          p=os.environ["PROVIDER"]
          prompt="""Teste ficticio, nao publicar. Uma transmissao de futebol entre Equipe A e Equipe B foi confirmada. Horario, campeonato e fotos nao foram fornecidos. Proponha tres angulos criativos distintos de pauta, escolha um e explique por que. Planeje uma agenda de jogo unico para feed. Nao invente dados. A arte deve usar Barlow Condensed, amarelo #FFD318 apenas em detalhes, logo GOAT ou bodinho (nunca ambos), foto com destaque e degrade suave; a foto deve ser solicitada se faltar. Indique DADOS ILUSTRATIVOS. Retorne apenas JSON com campos: angulos (lista de 3 textos), escolhido (um dos angulos), justificativa (texto), formato (agenda_jogo_unico), fonte (Barlow Condensed), amarelo (#FFD318), marca (logo ou bodinho), dados_faltantes (lista com horario, campeonato, foto), selo (DADOS ILUSTRATIVOS), aprovacao_necessaria (true). Escreva em portugues."""
          messages=[{"role":"user","content":prompt}]
          if p=="cloudflare":
              key=os.environ["CLOUDFLARE_API_TOKEN"]
              account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
              if not re.fullmatch(r"[a-fA-F0-9]{32}",account):sys.exit("Account ID invalido")
              model="@cf/meta/llama-3.1-8b-instruct-fp8-fast"
              url="https://api.cloudflare.com/client/v4/accounts/"+account+"/ai/run/"+model
              body={"messages":messages,"max_tokens":1000}
          else:
              key=os.environ["OPENROUTER_API_KEY"]
              model="openrouter/free"
              url="https://openrouter.ai/api/v1/chat/completions"
              body={"model":model,"messages":messages,"max_tokens":1500}
          if not key:sys.exit("Secret ausente")
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"})
          start=time.monotonic()
          try:
              with urllib.request.urlopen(req,timeout=90) as r: data=json.load(r)
          except urllib.error.HTTPError as e:sys.exit(f"HTTP {e.code}")
          if p=="cloudflare": answer=(data.get("result") or {}).get("response","")
          else: answer=((data.get("choices") or [{}])[0].get("message") or {}).get("content","")
          if not isinstance(answer,str):sys.exit("Resposta nao textual")
          print("Tempo:",round(time.monotonic()-start,2),"s")
          print("Modelo:",data.get("model") or model)
          print("Resposta:",json.dumps(answer,ensure_ascii=False))
          try:
              raw=answer.strip()
              if raw.startswith("```"):
                  raw=re.sub(r"^\x60\x60\x60(?:json)?\s*|\s*\x60\x60\x60$","",raw)
              d=json.loads(raw)
              if not isinstance(d,dict):raise ValueError()
          except Exception:sys.exit("JSON invalido")
          angles=d.get("angulos")
          missing=d.get("dados_faltantes")
          checks={
            "tres_angulos":isinstance(angles,list) and len(angles)==3 and all(isinstance(x,str) and x.strip() for x in angles) and len(set(str(x) for x in angles))==3,
            "escolha":isinstance(angles,list) and d.get("escolhido") in angles,
            "justificativa":bool(d.get("justificativa")),
            "formato":d.get("formato")=="agenda_jogo_unico",
            "fonte":d.get("fonte")=="Barlow Condensed",
            "cor":d.get("amarelo")=="#FFD318",
            "marca_unica":d.get("marca") in ["logo","bodinho"],
            "dados_faltantes":isinstance(missing,list) and {"horario","campeonato","foto"}.issubset({str(x).lower().replace("á","a") for x in missing}),
            "selo":d.get("selo")=="DADOS ILUSTRATIVOS",
            "aprovacao":d.get("aprovacao_necessaria") is True
          }
          print("Criterios:",json.dumps(checks))
          print("Pontuacao objetiva:",sum(checks.values()),"/",len(checks))
          if not all(checks.values()):sys.exit("Revisao necessaria")
          PY
