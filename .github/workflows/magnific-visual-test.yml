name: Magnific isolated visual test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Generate one test background
        env:
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
        run: |
          mkdir -p /tmp/magnific-test
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, uuid
          from pathlib import Path
          key = os.environ["MAGNIFIC_API_KEY"]
          base = "https://api.magnific.com/v1/ai/text-to-image/flux-2-turbo"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def request(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers={"x-magnific-api-key": key, "Content-Type": "application/json"})
              try:
                  with opener.open(req, timeout=25) as r:
                      return json.load(r)["data"]
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"HTTP {e.code}")
          task = request(base, {"prompt": "Abstract premium football broadcast background, dark charcoal black, subtle warm yellow light accents, restrained geometric textures, negative space, no people, no logos, no letters, no typography, no scores", "output_format":"png"})
          tid = str(uuid.UUID(task["task_id"]))
          print("Task created:", tid)
          for _ in range(40):
              task = request(base + "/" + tid)
              status = task.get("status")
              print("Status:", status)
              if status == "COMPLETED":
                  urls = task.get("generated") or []
                  if not urls: raise SystemExit("No image returned")
                  url = urls[0]
                  if not url.startswith("https://"): raise SystemExit("Unexpected image locator")
                  with urllib.request.urlopen(url, timeout=30) as r:
                      data = r.read(20*1024*1024+1)
                  if len(data)>20*1024*1024 or not data.startswith(b"\x89PNG\r\n\x1a\n"): raise SystemExit("Invalid PNG")
                  Path("/tmp/magnific-test/background.png").write_bytes(data)
                  break
              if status not in ("CREATED","IN_PROGRESS","PENDING","PROCESSING"): raise SystemExit("Task failed")
              time.sleep(5)
          else: raise SystemExit("Timeout; do not resubmit")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: magnific-visual-test
          path: /tmp/magnific-test/
          retention-days: 3
