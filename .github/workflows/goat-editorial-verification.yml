name: GOAT authenticated editorial verification
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: goat-editorial-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.1.0
      - name: Conferir somente a etapa editorial sem gravar no banco
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOAT_MAX_LLM_CALLS: '20'
        run: python -m tools.verify_release --live --editorial-only --output /tmp/goat-editorial-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goat-editorial-verification
          path: /tmp/goat-editorial-verification/
          retention-days: 7
          if-no-files-found: warn
