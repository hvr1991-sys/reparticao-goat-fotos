name: Teste das IAs GOAT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        provider: [groq, cloudflare, openrouter]
    steps:
      - name: Testar conexao e resposta
        env:
          PROVIDER: ${{ matrix.provider }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error, time, re
          p = os.environ["PROVIDER"]
          prompt = "Responda apenas com GOAT_OK, sem explicacoes."
          messages = [{"role":"user","content":prompt}]
          if p == "groq":
              key = os.environ["GROQ_API_KEY"]
              url = "https://api.groq.com/openai/v1/chat/completions"
              model = "openai/gpt-oss-20b"
              body = {"model":model,"messages":messages,"max_completion_tokens":256}
          elif p == "openrouter":
              key = os.environ["OPENROUTER_API_KEY"]
              url = "https://openrouter.ai/api/v1/chat/completions"
              model = "openrouter/free"
              body = {"model":model,"messages":messages,"max_tokens":256}
          else:
              key = os.environ["CLOUDFLARE_API_TOKEN"]
              account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
              if not re.fullmatch(r"[a-fA-F0-9]{32}", account):
                  sys.exit("Account ID ausente ou invalido")
              model = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
              url = "https://api.cloudflare.com/client/v4/accounts/"+account+"/ai/run/"+model
              body = {"messages":messages,"max_tokens":64}
          if not key:
              sys.exit("Secret ausente")
          req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"})
          start = time.monotonic()
          try:
              with urllib.request.urlopen(req,timeout=65) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              sys.exit(f"{p}: HTTP {e.code} (401/403: acesso; 429: limite; 400/404: modelo ou requisicao)")
          except Exception as e:
              sys.exit(f"{p}: falha {type(e).__name__}")
          if p == "cloudflare":
              result = data.get("result") or {}
              answer = result.get("response","") if isinstance(result,dict) else ""
          else:
              choices = data.get("choices") or []
              answer = (choices[0].get("message") or {}).get("content","") if choices else ""
          if not isinstance(answer,str) or not answer.strip():
              sys.exit(f"{p}: resposta textual ausente")
          ok = "GOAT_OK" in answer.upper()
          print(f"Provedor: {p} | Modelo solicitado: {model} | HTTP 2xx | Tempo: {time.monotonic()-start:.2f}s | Instrucao seguida: {ok}")
          if not ok:
              sys.exit("Conexao OK, mas instrucao nao seguida")
          PY
