name: Laboratorio GOAT 2.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motor-goat-2.0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow==11.1.0 numpy==2.2.2 playwright==1.49.1
      - run: python -m playwright install --with-deps chromium
      - name: Renderizar composicoes e validar
        run: |
          mkdir -p laboratorio
          PYTHONPATH=kit python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import render_v2 as v
          p=Path("laboratorio")
          a="fotos/90ba0dee-0846-45cd-9f01-1694ec9f855f-j82/1.png"
          b="fotos/609a90e4-273f-4eab-93b4-e7c7a5d3b613-j113/1.png"
          f="https://www.spl.com.sa/en/news/ronaldo-marks-return-with-brilliant-goal-earns-postecoglou-praise"
          g="https://www.the-afc.com/en/club/afc_champions_league_elite.html/news/md5-al-nassr-club-ksa-2-1-al-sadd-sc-qat"
          common=dict(ilustrativo=True,marca="logo")
          photo=dict(foto=a,fonte=f)
          jogo=dict(campeonato="TESTE DE LAYOUT",confronto="EQUIPE A X EQUIPE B",data="28/11",hora="18H")
          title=[dict(texto="TESTE DE"),dict(texto="COMPOSIÇÃO",amarelo=True)]
          specs=[
            dict(common,tipo="confronto_duplo",fotos=[dict(arquivo=a,fonte=f),dict(arquivo=b,fonte=g)],jogo=jogo,titulo=title,pre_jogo="17H"),
            dict(common,**photo,tipo="agenda_campeonato",campeonato="TESTE DE LAYOUT",dias=[dict(data="SÁBADO",jogos=[dict(confronto="EQUIPE A X EQUIPE B",horario="18H"),dict(confronto="EQUIPE C X EQUIPE D",horario="20H")]),dict(data="DOMINGO",jogos=[dict(confronto="EQUIPE E X EQUIPE F",horario="16H")])]),
            dict(common,tipo="classificacao",campeonato="TESTE DE LAYOUT",fonte_dado="Fixture sintetica",linhas=[dict(pos=i,clube=f"EQUIPE {i:02}",pts=61-i*2,zona="acesso" if i<=2 else "rebaixamento" if i>=17 else "normal") for i in range(1,21)]),
            dict(common,**photo,tipo="marco",fonte_dado="Fixture sintetica",nome="TESTE DE LAYOUT",unidade="PONTOS",atual=86,meta=100,apoio="EXEMPLO DE CONTAGEM"),
            dict(common,**photo,tipo="contexto",fonte_dado="Fixture sintetica",titulo=title,linhas=[dict(rotulo="EQUIPE A",valor="30"),dict(rotulo="EQUIPE B",valor="28",destaque=True)],jogo=jogo)
          ]
          report=[]
          for i,s in enumerate(specs,1):
              dest=p/f"{i:02}-{s['tipo']}.png"
              try:
                  v.render(s,dest)
                  with Image.open(dest) as im:
                      assert im.size==(1080,1350)
                      im.verify()
                  report.append(dict(tipo=s["tipo"],ok=True))
              except Exception as e:
                  report.append(dict(tipo=s["tipo"],ok=False,erro=str(e)))
              dest.with_suffix(".json").write_text(json.dumps(s,ensure_ascii=False,indent=2))
          (p/"resultado.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          if not all(x["ok"] for x in report):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laboratorio-goat-v2
          path: laboratorio/
          retention-days: 3
